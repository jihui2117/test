<head>

    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 로드 (가독성을 위한 Noto Sans KR, 타이머를 위한 모노스페이스) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #23243d;
            color: #fff;
            overflow-x: hidden;
            isolation: isolate;
        }

        .market-backdrop {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .timer-font {
            font-family: 'Share Tech Mono', monospace;
        }

        /* 오답 시 화면 흔들림 & 붉은 점멸 효과 */
        @keyframes shake-red {
            0% { transform: translateX(0); box-shadow: inset 0 0 0px rgba(255,0,0,0); }
            20% { transform: translateX(-10px) rotate(-1deg); box-shadow: inset 0 0 50px rgba(255,0,0,0.8); }
            40% { transform: translateX(10px) rotate(1deg); box-shadow: inset 0 0 50px rgba(255,0,0,0.8); }
            60% { transform: translateX(-10px) rotate(-1deg); box-shadow: inset 0 0 50px rgba(255,0,0,0.8); }
            80% { transform: translateX(10px) rotate(1deg); box-shadow: inset 0 0 50px rgba(255,0,0,0.8); }
            100% { transform: translateX(0); box-shadow: inset 0 0 0px rgba(255,0,0,0); }
        }

        .penalty-anim {
            animation: shake-red 0.4s ease-in-out;
        }

        /* 패널티 텍스트가 떠오르는 애니메이션 */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        .floating-penalty {
            position: absolute;
            color: #ff4757;
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: float-up 1s forwards;
            pointer-events: none;
            z-index: 50;
        }

        /* 슬라이드 애니메이션 */
        @keyframes slide-out-left {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }
        @keyframes slide-in-right {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .slide-out .speech-bubble,
        .slide-out #current-person { animation: slide-out-left 0.3s forwards ease-in; }
        .slide-in .speech-bubble { animation: slide-in-right 0.3s forwards ease-out; }
        @keyframes step-to-front {
            from { transform: translate(57px, -10px) scale(.76); opacity: .6; }
            to { transform: translate(0, 0) scale(1); opacity: 1; }
        }
        .slide-in #current-person {
            transform-origin: 50px 60px;
            animation: step-to-front 0.3s forwards ease-out;
        }

        .character-line {
            width: min(100%, 320px);
            height: auto;
        }

        /* 말풍선 스타일 */
        .speech-bubble {
            position: relative;
            background: white;
            border-radius: .4em;
            color: black;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 0;
            border: 20px solid transparent;
            border-top-color: white;
            border-bottom: 0;
            margin-left: -20px;
            margin-bottom: -20px;
        }

        /* 버튼 호버 액션 */
        .answer-btn {
            transition: all 0.2s;
        }
        .answer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .answer-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>

    <div id="result-screen" class="hidden bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">

        <div class="bg-blue-900/50 border border-blue-400/50 rounded-lg p-4 mb-6">
            <p class="font-bold text-blue-200 text-lg animate-pulse">📸 이 화면을 캡쳐해서</p>

        <button onclick="location.reload()" class="w-full bg-white/20 hover:bg-white/30 text-white font-bold text-lg py-3 rounded-xl transition">
            다시 도전하기

    <script>
        // 1. 문제 데이터 (일본어/한국어 혼합)
        const questionPool = [
            { q: "저기요! 『スポーツでは 何が 好きですか。』", a: "やきゅうが 好きです。", options: ["やきゅうが 好きです。", "みかんが 好きです。", "英語が 好きです。"] },
            { q: "어이! 『あの 町は どうですか。』라고 묻잖아. 무슨 뜻이야?", a: "저 마을은 어떻습니까?", options: ["저 마을은 어떻습니까?", "저 마을은 어디입니까?", "이 마을은 어떻습니까?"] },
            { q: "잠깐! '별로 유명하지 않습니다'라고 대답하려면?!", a: "あまり ゆうめいじゃ ありません。", options: ["あまり ゆうめいじゃ ありません。", "とても ゆうめいです。", "ゆうめいじゃ ありませんでした。"] },
            { q: "학생! 『くだものでは 何が 好きですか。』", a: "いちごが 好きです。", options: ["いちごが 好きです。", "バスケが 好きです。", "すうがくが 好きです。"] },
            { q: "거기 학생! 『あの びょういんは しんせつだ。』가 무슨 뜻이야?", a: "저 병원은 친절하다.", options: ["저 병원은 친절하다.", "저 병원은 유명하다.", "저 병원은 조용하다."] },
            { q: "이봐! '음료수 중에서는 무엇을 좋아합니까?'라고 물어봐!", a: "のみものでは 何が 好きですか。", options: ["のみものでは 何が 好きですか。", "くだものでは 何が 好きですか。", "スポーツでは 何が 好きですか。"] },
            { q: "있잖아! 『かもくでは 何が 好きですか。』", a: "すうがくが 好きです。", options: ["すうがくが 好きです。", "テニスが 好きです。", "りんごが 好きです。"] },
            { q: "잠깐만! 누군가 나한테 『とても にぎやかです。』라고 했어. 무슨 뜻이야?", a: "매우 번화합니다.", options: ["매우 번화합니다.", "매우 조용합니다.", "조금 번화합니다."] },
            { q: "어이! '저 온천은 어때?'라고 묻고 싶어!", a: "あの おんせんは どうですか。", options: ["あの おんせんは どうですか。", "その おんせんは どうですか。", "あの 町は どうですか。"] },
            { q: "잠깐만요! 『その スマホは どうですか。』", a: "とても べんりです。", options: ["とても べんりです。", "とても きれいです。", "とても しんせつです。"] },
            { q: "이봐! 『歌が 上手だ』라고 하던데, 무슨 말이야?", a: "노래를 잘한다.", options: ["노래를 잘한다.", "노래가 예쁘다.", "노래를 좋아한다."] },
            { q: "거기! '매우 조용합니다'라고 말해주고 싶어!", a: "とても しずかです。", options: ["とても しずかです。", "あまり しずかじゃ ありません。", "とても ゆうめいです。"] },
            { q: "저기! 『たいいくが 好きです。』", a: "체육을 좋아합니다.", options: ["체육을 좋아합니다.", "수학을 좋아합니다.", "음악을 좋아합니다."] },
            { q: "잠깐! '사과'가 일본어로 뭐였지?!", a: "りんご", options: ["りんご", "いちご", "みかん"] },
            { q: "어이! 『あの 町は にぎやかだ。』 무슨 뜻이야?", a: "저 마을은 번화하다.", options: ["저 마을은 번화하다.", "저 마을은 조용하다.", "이 마을은 편리하다."] }
        ];

        const characters = [
            'farmer',
            'blonde',
            'elder',
            'officer',
            'student',
            'chef',
            'singer',
            'detective',
            'ninja'
        ];

        // 2. 전역 변수
        let gameQuestions = []; // 랜덤으로 10개 뽑아서 저장할 배열
        let characterQueue = [];
        let currentQuestionIndex = 0;
        let startTime;
        let timerInterval;
        let totalPenalty = 0;
        const TOTAL_QUESTIONS = 10;

        // UI 요소
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const gameContainer = document.getElementById('game-container');
        const timerDisplay = document.getElementById('timer');
        const progressDisplay = document.getElementById('progress');
        const characterArea = document.getElementById('character-area');
        const questionDisplay = document.getElementById('question-text');
        const characterSlots = ['current-person', 'next-person', 'later-person'].map(id => document.getElementById(id));
        const answersContainer = document.getElementById('answers-container');

        // 3. 유틸리티 함수: 배열 셔플 (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 4. 게임 시작
        function startGame() {
            // 초기화
            currentQuestionIndex = 0;
            totalPenalty = 0;
            
            // 문제 풀 셔플 후 10개 추출
            const shuffledPool = shuffle([...questionPool]);
            gameQuestions = shuffledPool.slice(0, TOTAL_QUESTIONS);
            const shuffledCharacters = shuffle([...characters]);
            characterQueue = gameQuestions.map((_, index) => shuffledCharacters[index % shuffledCharacters.length]);

            // 화면 전환
            screens.start.classList.add('hidden');
            screens.game.classList.remove('hidden');

            // 첫 문제 로드
            loadQuestion();

            // 타이머 시작
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 50); // 50ms 마다 갱신 (부드러운 카운팅)
        }

        // 5. 타이머 갱신
        function updateTimer() {
            const currentTime = Date.now();
            const elapsed = (currentTime - startTime) / 1000 + totalPenalty;
            timerDisplay.innerText = elapsed.toFixed(1);
        }

        // 6. 문제 로드
        function loadQuestion() {
            const currentQ = gameQuestions[currentQuestionIndex];
            
            // 애니메이션 클래스 설정
            characterArea.classList.remove('slide-out');
            characterArea.classList.add('slide-in');

            // 헤더 업데이트
            progressDisplay.innerText = `${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            
            // 질문을 표시하고 현재 인물과 뒤에서 기다리는 인물들을 배치
            questionDisplay.innerText = currentQ.q;
            characterSlots.forEach((slot, offset) => {
                const person = characterQueue[currentQuestionIndex + offset];
                slot.style.display = person ? '' : 'none';
                if (!person) return;
                slot.querySelector('use').setAttribute('href', `#person-${person}`);
            });

            // 선택지 셔플
            let answerOptions = [...currentQ.options];
            answerOptions = shuffle(answerOptions);

            answersContainer.innerHTML = '';
            answerOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn w-full bg-blue-900/80 hover:bg-blue-700 border border-blue-400/50 text-white font-bold py-4 px-6 rounded-xl text-left text-lg shadow-md flex items-center group';
                
                btn.innerHTML = `
                    <span class="flex-grow">${option}</span>
                    <span class="text-blue-300 opacity-0 group-hover:opacity-100 transition-opacity transition-transform transform translate-x-[-10px] group-hover:translate-x-0">▶</span>
                `;
                
                // 정답 여부 판별
                const isCorrect = (option === currentQ.a);
                btn.onclick = () => checkAnswer(isCorrect, btn);
                answersContainer.appendChild(btn);
            });
        }

        // 7. 정답 체크
        function checkAnswer(isCorrect, buttonElement) {
            // 중복 클릭 방지를 위해 컨테이너 일시 비활성화
            answersContainer.style.pointerEvents = 'none';

            if (isCorrect) {
                // 정답 시
                buttonElement.classList.remove('bg-blue-900/80', 'hover:bg-blue-700');
                buttonElement.classList.add('bg-green-600', 'border-green-400');
                
                // 슬라이드 아웃 애니메이션 실행
                characterArea.classList.remove('slide-in');
                characterArea.classList.add('slide-out');
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < TOTAL_QUESTIONS) {
                        loadQuestion();
                        answersContainer.style.pointerEvents = 'auto';
                    } else {
                        endGame();
                    }
                }, 300); // 0.3초 대기 후 다음 문제

            } else {
                // 오답 시 패널티 부여
                totalPenalty += 3; // 3초 추가
                updateTimer(); // 즉각적인 UI 반영
                
                // 버튼 시각적 피드백
                buttonElement.classList.remove('bg-blue-900/80', 'hover:bg-blue-700');
                buttonElement.classList.add('bg-red-600', 'border-red-400');
                
                // 화면 전체 흔들림 및 붉은 이펙트
                gameContainer.classList.add('penalty-anim');
                
                // 마우스 클릭 위치 근처에 "+3초" 텍스트 띄우기
                showFloatingPenalty();

                setTimeout(() => {
                    gameContainer.classList.remove('penalty-anim');
                    // 버튼 색상 원상복구
                    buttonElement.classList.remove('bg-red-600', 'border-red-400');
                    buttonElement.classList.add('bg-blue-900/80', 'hover:bg-blue-700');
                    
                    answersContainer.style.pointerEvents = 'auto'; // 다시 클릭 가능하게
                }, 400); // 애니메이션 시간(0.4초) 후 원상복구
            }
        }

        // 8. 패널티 +3초 플로팅 텍스트 애니메이션
        function showFloatingPenalty() {
            const el = document.createElement('div');
            el.innerText = "+3.0초";
            el.className = 'floating-penalty';
            
            // 화면 중앙 상단 부근에 띄우기
            el.style.top = '25%';
            el.style.left = '50%';
            el.style.transform = 'translate(-50%, -50%)';
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, 1000);
        }

        // 9. 게임 종료
        function endGame() {
            clearInterval(timerInterval); // 타이머 정지
            
            // 최종 시간 계산
            const currentTime = Date.now();
            const finalTime = ((currentTime - startTime) / 1000 + totalPenalty).toFixed(1);
            
            // 화면 전환
            screens.game.classList.add('hidden');
            screens.result.classList.remove('hidden');
            
            // 최종 시간 표시
            document.getElementById('final-time').innerText = finalTime;
        }
    </script>
</body>
</html>
